<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Nepal Map</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  object {
    width: 80%;
    height: auto;
    border: none;
  }

  /* Optional: tooltip style */
  #tooltip {
    position: absolute;
    padding: 6px 10px;
    background: #333;
    color: white;
    font-size: 14px;
    border-radius: 4px;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<!-- Embed the SVG -->
<object id="nepal-map" type="image/svg+xml" data="np.svg"></object>
<div id="tooltip"></div>

<script>
  const provinceNames = {
    "NPBA": "Bagmati", 
    "NPBH": "Bheri", 
    "NPDH": "Dhawalagiri", 
    "NPGA": "Gandaki", 
    "NPJA": "Janakpur", 
    "NPKA": "Karnali", 
    "NPKO": "Bhojpur", 
    "NPLU": "Lumbini", 
    "NPMA": "Mahakali", 
    "NPME": "Mechi", 
    "NPNA": "Narayani", 
    "NPRA": "Rapti", 
    "NPSA": "Sagarmatha", 
    "NPSE": "Seti"
  };

  const tooltip = document.getElementById('tooltip');

  const obj = document.getElementById('nepal-map');
  obj.addEventListener('load', () => {
    const svgDoc = obj.contentDocument; // get the SVG document inside <object>
    const paths = svgDoc.querySelectorAll('path, polygon, rect'); // grab all shapes

    paths.forEach(p => {
      const id = p.id;
      const name = provinceNames[id] || id;

      // Hover effect
      p.addEventListener('mouseover', (e) => {
        p.style.fill = '#66b3ff';
        tooltip.style.display = 'block';
        tooltip.textContent = name;
      });

      p.addEventListener('mousemove', (e) => {
        tooltip.style.left = e.pageX + 10 + 'px';
        tooltip.style.top = e.pageY + 10 + 'px';
      });

      p.addEventListener('mouseout', () => {
        p.style.fill = ''; // reset fill
        tooltip.style.display = 'none';
      });

      // Click effect
      p.addEventListener('click', () => {
        alert('You clicked on: ' + name);
      });
    });
  });
</script>

</body>
</html>
